name: Xcode - Build and Analyze

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    name: Build and Analyze
    # macOS 26: Xcode's Icon Composer renderer (AppIcon.icon) crashes actool on the macOS 15 image
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version
          swift --version

      - name: Resolve Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project PixelDiet.xcodeproj \
            -scheme PixelDiet

      - name: Build and Analyze
        run: |
          xcodebuild clean build analyze \
            -project PixelDiet.xcodeproj \
            -scheme PixelDiet \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # Unit tests only: the UI journeys (PixelDietUITests) drive the real app for several
      # minutes and need an interactive session, so they run locally before each release.
      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project PixelDiet.xcodeproj \
            -scheme PixelDiet \
            -destination 'platform=macOS' \
            -only-testing:PixelDietTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
